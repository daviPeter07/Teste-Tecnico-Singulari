services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newsletter_frontend_only
    env_file:
      - ./.env
    environment:
      BACKEND_INTERNAL_URL: http://host.docker.internal:3333
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: sh -c "pnpm dev --hostname 0.0.0.0 --port 3000"

volumes:
  frontend_node_modules:
  frontend_next:
