services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: newsletter_frontend
    env_file:
      - ./frontend/.env
    environment:
      BACKEND_INTERNAL_URL: http://api:3333
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      api:
        condition: service_healthy
    command: sh -c "pnpm dev --hostname 0.0.0.0 --port 3000"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newsletter_api
    env_file:
      - ./backend/.env
    environment:
      CI: "true"
      SERVICE_MODE: api
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/newsletter_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3333:3333"
    volumes:
      - ./backend:/app
      - backend_api_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3333/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: newsletter_worker
    env_file:
      - ./backend/.env
    environment:
      CI: "true"
      SERVICE_MODE: worker
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/newsletter_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./backend:/app
      - backend_worker_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: newsletter_db
    env_file:
      - ./backend/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d newsletter_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: newsletter_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  frontend_node_modules:
  frontend_next:
  backend_api_node_modules:
  backend_worker_node_modules:
  postgres_data:
  redis_data:
